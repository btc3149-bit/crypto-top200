# crypto-top200-fetcher — W2-01 抓取 Worker（独立于 Pages 项目 crypto-top200）
# 现行形态（G3 终局，2026-11-19 起）：Cron 已启用 */10 * * * *（见下方 [triggers]）、
# BOARD_TARGET_KEY="current" 直写生产键、无 BOARD_FETCH_DISABLED（未设置=启用抓取；
# 紧急停抓才置 "1"，口径见 README 开关表）。fetcher 侧 COINGECKO_API_KEY 已注入
# （Secret，不在本文件）。PAPRIKA_ENABLED="false"，Paprika 备源保持关闭。
# 历史注记：2026-11-10 的 G0 形态曾禁用 Cron（BOARD_FETCH_DISABLED="1" 且不注册
# triggers），G1 曾以 BOARD_TARGET_KEY="shadow" 影子运行——均为历史，不得照此操作。
name = "crypto-top200-fetcher"
main = "src/index.js"
compatibility_date = "2026-11-01"

[[kv_namespaces]]
binding = "BOARD_KV"
id = "ad1b72702c5c4f229999bea5b118d1bc"

[vars]
PAPRIKA_ENABLED = "false"
BOARD_SOURCE = "auto"
BOARD_TARGET_KEY = "current"

[triggers]
crons = ["*/10 * * * *"]

# Secrets（值不写在本文件，经 wrangler secret put 注入，均由协调者处理）：
# COINGECKO_API_KEY — 与 Pages Secret 独立的一份注入
# MANUAL_RUN_TOKEN — POST /run 手动补抓校验头 x-manual-token 的值
