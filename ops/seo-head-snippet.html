<!-- ============================================================
  W2-16 SEO head 定版片段（交协调者在前端列车后统一合入 public/index.html 的 <head>）
  依据：PHASE2_PLAN.md W2-16 §1/§2/§3/§5/§8/§9，逐字定版，合入时勿改文案。
  合入顺序：title（沿用现行，不动）之后依次为 description、canonical、OG、Twitter、
  theme-color、favicon 三行、JSON-LD。
  站名来源：现行 index.html 的 <title> 原文「市值前200币种 · 下一轮牛市预估排名（实时行情）」，
  og:site_name / og:title / JSON-LD 的 WebSite.name 与 Dataset creator.name 均抄此原文，不新造。
  /privacy 页合入项：自指 canonical（已在其草稿内）+ 基础 OG（title/description/url/type，
  og:image 复用全站 https://top200.oppcal.com/og-cover.jpg）。
  ============================================================ -->

<!-- §1 meta description（定版文案，OG/Twitter description 复用同一文案，三处必须一致） -->
<meta name="description" content="市值前200加密货币下一轮牛市预估排名：实时价格、市值与上涨倍数空间一览，数据来自 CoinGecko 实时行情。本站为历史周期分析推演，不构成投资建议。">

<!-- §2 canonical（首页自指；*.pages.dev 不得写入） -->
<link rel="canonical" href="https://top200.oppcal.com/">

<!-- §3 Open Graph -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="市值前200币种 · 下一轮牛市预估排名（实时行情）">
<meta property="og:locale" content="zh_CN">
<meta property="og:title" content="市值前200币种 · 下一轮牛市预估排名（实时行情）">
<meta property="og:description" content="市值前200加密货币下一轮牛市预估排名：实时价格、市值与上涨倍数空间一览，数据来自 CoinGecko 实时行情。本站为历史周期分析推演，不构成投资建议。">
<meta property="og:url" content="https://top200.oppcal.com/">
<meta property="og:image" content="https://top200.oppcal.com/og-cover.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="市值前200加密货币预估排名榜单封面">

<!-- §3 Twitter Card（逐项与 OG 同值写死，不依赖平台回退） -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="市值前200币种 · 下一轮牛市预估排名（实时行情）">
<meta name="twitter:description" content="市值前200加密货币下一轮牛市预估排名：实时价格、市值与上涨倍数空间一览，数据来自 CoinGecko 实时行情。本站为历史周期分析推演，不构成投资建议。">
<meta name="twitter:image" content="https://top200.oppcal.com/og-cover.jpg">

<!-- §9 theme-color（深色单主题，两行同值） -->
<meta name="theme-color" content="#0b0e14">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0e14">

<!-- §5 favicon 三行 -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
